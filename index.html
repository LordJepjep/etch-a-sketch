<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Etch-a-Sketch</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="main">
      <div class="controls">
        <!-- <button class="resize-button" onclick="resizeGrid()">Resize Grid</button> -->
        <div class="slider-container">
          <label for="size-slider" class="size">16 X 16</label>
          <input
            type="range"
            name="size-slider"
            id="size-slider"
            min="2"
            max="100"
            value="16"
            onchange="resizeGrid()"
          />
        </div>
        <button class="mode-btn active" data-mode="color">Color Mode</button>
        <button class="mode-btn" data-mode="random">Random Mode</button>
        <button class="mode-btn" data-mode="eraser">Eraser</button>
        <button onclick="clearGrid()">Clear Board</button>
        <div class="color-controls">
          <div class="control-group">
            <label for="color-picker">Brush Color</label>
            <input type="color" id="color-picker" value="#000000" />
          </div>
          <div class="control-group">
            <input type="checkbox" id="darken-option" />
            <label for="darken-option">Darkening Colors</label>
          </div>
        </div>
      </div>
      <div class="container"></div>
    </div>
    <script src="script.js" defer></script>
  </body>
</html>
